<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="VeloSillon : vélo, chemin et nourriture">
  <!-- fond arrondi dégradé vert -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7d4f"/>
      <stop offset="1" stop-color="#4c9d63"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- chemin sinueux (route) -->
  <path d="M 18 88 C 30 70, 14 58, 28 46 C 40 36, 60 44, 66 30 C 70 20, 62 12, 74 8"
        fill="none" stroke="#f4efe4" stroke-width="7" stroke-linecap="round"/>
  <path d="M 18 88 C 30 70, 14 58, 28 46 C 40 36, 60 44, 66 30 C 70 20, 62 12, 74 8"
        fill="none" stroke="#f28c28" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 9"/>

  <!-- roue arrière du vélo -->
  <circle cx="30" cy="76" r="12" fill="none" stroke="#f4efe4" stroke-width="4"/>
  <circle cx="30" cy="76" r="2.6" fill="#f4efe4"/>

  <!-- cadre + fourna vers l'avant -->
  <path d="M 30 76 L 46 54 L 62 76 M 46 54 L 54 54 L 62 76 M 54 54 L 58 44"
        fill="none" stroke="#f4efe4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- nourriture : pomme sur le guidon -->
  <circle cx="62" cy="38" r="9" fill="#e94f37"/>
  <path d="M 62 30 C 61 26, 63 24, 65 22" fill="none" stroke="#f4efe4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 62 29 C 58 27, 56 29, 56 32 C 59 33, 62 32, 62 29 Z" fill="#7cb342"/>
</svg>
